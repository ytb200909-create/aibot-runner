name: WheyMass
options:
  bundleIdPrefix: com.wheymass
  deploymentTarget:
    iOS: "13.0"
targets:
  WheyMass:
    type: application
    platform: iOS
    sources:
      - WheyMass
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wheymass.app
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Whey Mass"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGNING_ALLOWED: NO
