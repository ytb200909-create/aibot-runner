name: Update web link
on:
  push:
    branches: [main]
    paths: ["whey-mass-calculator.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out && cp whey-mass-calculator.html out/index.html && cd out
          git init -q -b gh-pages && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Update ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
